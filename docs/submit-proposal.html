<!DOCTYPE html>
<html>
<head>
    <title>Submit Proposal</title>
</head>
<body>

    <h1>Submit Proposal</h1>

    <form id="proposalForm">
        <input id="organization_id" type="number" placeholder="Organization ID" required>
        <input id="title" type="text" placeholder="Title" required>
        <textarea id="description" placeholder="Description"></textarea>
        <input id="file_url" type="text" placeholder="File URL">

        <button type="submit">Submit</button>
    </form>

    <script type="module" src="./js/submit-proposal.js"></script>

</body>
</html>
